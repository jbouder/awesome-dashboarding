# Publishes the static examples to GitHub Pages. The data in them is
# synthetic and embedded: anyone with the link can read it, by design.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/index.html"
      - "examples/02-static-html/**"
      - "examples/04-chart-libraries/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the static examples
        run: |
          mkdir -p _site
          cp examples/index.html _site/
          cp -r examples/02-static-html examples/04-chart-libraries _site/
          find _site -name '*.md' -delete
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
