<script>
const S = JSON.parse(document.getElementById("lumen-snapshot").textContent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CHANNELS = ["web", "mobile", "partner"];
// Long rows: { quarter, channel, revenue } for EMEA, last four full quarters.
const long = (S.channels || []).filter(r => r.region === "EMEA").map(({ quarter, channel, revenue }) => ({ quarter, channel, revenue }));
const quarters = [...new Set(long.map(r => r.quarter))];
// Wide rows: { quarter, web, mobile, partner }, for libraries that want one key per series.
const wide = quarters.map(q => Object.fromEntries([["quarter", q], ...CHANNELS.map(c => [c, (long.find(r => r.quarter === q && r.channel === c) || {}).revenue || 0])]));
// Weekly EMEA revenue per channel, for uPlot.
const weeks = [...new Set((S.weekly || []).filter(r => r.region === "EMEA").map(r => r.week))];
const weekly = { weeks, ...Object.fromEntries(CHANNELS.map(c => [c, weeks.map(w => ((S.weekly || []).find(r => r.week === w && r.region === "EMEA" && r.channel === c) || {}).revenue || 0)])) };
const colors = () => [css("--s1"), css("--s2"), css("--s3")];

const LIBS = [
  { key: "vegalite", name: "Vega-Lite", license: "BSD-3", note: "A small JSON spec. Easy for a model to write and to validate.",
    draw: function vegaLite(el, long, colors) {
      vegaEmbed(el, {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        data: { values: long }, width: "container", height: 240, background: "transparent",
        mark: { type: "bar", tooltip: true },
        encoding: {
          x: { field: "quarter", type: "ordinal", title: null, axis: { labelAngle: 0 } },
          y: { field: "revenue", type: "quantitative", title: "Revenue (USD)", axis: { format: "$~s" } },
          color: { field: "channel", sort: ["web", "mobile", "partner"], scale: { domain: ["web", "mobile", "partner"], range: colors } },
        },
        config: { axis: { labelColor: css("--text-muted"), titleColor: css("--text-muted"), gridColor: css("--border") }, legend: { labelColor: css("--text"), titleColor: css("--text") } },

    } },
  { key: "echarts", name: "Apache ECharts", license: "Apache 2.0", note: "JSON options and a huge chart catalog.",
    draw: function eCharts(el, wide, colors) {
      const chart = echarts.init(el);
      chart.setOption({
        color: colors, textStyle: { color: css("--text") },
        tooltip: { trigger: "axis" }, legend: { top: 0, textStyle: { color: css("--text-muted") } },
        grid: { left: 56, right: 12, top: 36, bottom: 28 },
        xAxis: { type: "category", data: wide.map(r => r.quarter), axisLabel: { color: css("--text-muted") } },
        yAxis: { type: "value", axisLabel: { color: css("--text-muted"), formatter: v => `$${v / 1e6}M` }, splitLine: { lineStyle: { color: css("--border") } } },

      });
      return chart;
    } },
  { key: "recharts", name: "Recharts (what shadcn charts wrap)", license: "MIT", note: "React components that fit a design system. Here without JSX, so it runs with no build step.",
    draw: function recharts(el, wide, colors) {
      const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, Legend, CartesianGrid } = Recharts;
      const h = React.createElement;
      ReactDOM.createRoot(el).render(
        h(ResponsiveContainer, { width: "100%", height: "100%" },
          h(BarChart, { data: wide, margin: { top: 8, right: 8, left: 8, bottom: 0 } },
            h(CartesianGrid, { strokeDasharray: "3 3", stroke: css("--border"), vertical: false }),
            h(XAxis, { dataKey: "quarter", stroke: css("--text-muted") }),
            h(YAxis, { stroke: css("--text-muted"), tickFormatter: v => `$${v / 1e6}M` }),
            h(Tooltip, { formatter: v => `$${Math.round(v).toLocaleString()}` }),
            h(Legend, null),
            ["web", "mobile", "partner"].map((c, i) => h(Bar, { key: c, dataKey: c, stackId: "a", fill: colors[i] })))));
    } },
  { key: "plotly", name: "Plotly", license: "MIT", note: "One call per chart, the same API in Python and JavaScript.",
    draw: function plotly(el, wide, colors) {
      Plotly.newPlot(el, ["web", "mobile", "partner"].map((c, i) => ({
        type: "bar", name: c, x: wide.map(r => r.quarter), y: wide.map(r => r[c]), marker: { color: colors[i] },
      })), {
        barmode: "stack", margin: { l: 56, r: 8, t: 8, b: 32 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        font: { family: css("--font-sans"), color: css("--text") }, legend: { orientation: "h", y: 1.12 },
        yaxis: { tickprefix: "$", tickformat: "~s", gridcolor: css("--border") },
      }, { displayModeBar: false, responsive: true });
    } },
  { key: "d3", name: "D3", license: "ISC", note: "Unlimited control. Every axis, scale, and legend is yours to write.",
    draw: function d3Chart(el, wide, colors) {
      const keys = ["web", "mobile", "partner"];
      const width = el.clientWidth, height = el.clientHeight, m = { top: 28, right: 8, bottom: 28, left: 56 };
      const svg = d3.select(el).append("svg").attr("width", width).attr("height", height);
      const series = d3.stack().keys(keys)(wide);
      const x = d3.scaleBand().domain(wide.map(r => r.quarter)).range([m.left, width - m.right]).padding(0.25);
      const y = d3.scaleLinear().domain([0, d3.max(series.at(-1), d => d[1])]).nice().range([height - m.bottom, m.top]);
      const color = d3.scaleOrdinal(keys, colors);
      svg.append("g").selectAll("g").data(series).join("g").attr("fill", d => color(d.key))
        .selectAll("rect").data(d => d).join("rect")
        .attr("x", d => x(d.data.quarter)).attr("y", d => y(d[1])).attr("height", d => y(d[0]) - y(d[1])).attr("width", x.bandwidth())
        .append("title").text(d => `$${Math.round(d[1] - d[0]).toLocaleString()}`);
      const axisColor = g => g.call(s => s.selectAll("text").attr("fill", css("--text-muted"))).call(s => s.selectAll("line,path").attr("stroke", css("--border")));
      svg.append("g").attr("transform", `translate(0,${height - m.bottom})`).call(d3.axisBottom(x)).call(axisColor);
      svg.append("g").attr("transform", `translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d => `$${d / 1e6}M`)).call(axisColor);
      const legend = svg.append("g").attr("transform", `translate(${m.left},8)`).selectAll("g").data(keys).join("g").attr("transform", (d, i) => `translate(${i * 80},0)`);
      legend.append("rect").attr("width", 12).attr("height", 12).attr("fill", d => color(d));
      legend.append("text").attr("x", 16).attr("y", 10).attr("fill", css("--text")).attr("font-size", 12).text(d => d);
    } },
  { key: "uplot", name: "uPlot", license: "MIT", note: "Very fast time series. Weekly EMEA revenue, since uPlot does not do categorical bars.",
    draw: function uPlotChart(el, weekly, colors) {
      const t = weekly.weeks.map(w => Date.parse(w + "T00:00:00Z") / 1000);
      new uPlot({
        width: el.clientWidth, height: el.clientHeight, legend: { show: true },
        axes: [{ stroke: css("--text-muted"), grid: { stroke: css("--border") } },
               { stroke: css("--text-muted"), grid: { stroke: css("--border") }, values: (u, v) => v.map(x => `$${x / 1e3}K`), size: 60 }],
        series: [{}, ...["web", "mobile", "partner"].map((c, i) => ({ label: c, stroke: colors[i], width: 2, value: (u, v) => v == null ? "" : `$${Math.round(v).toLocaleString()}` }))],
      }, [t, weekly.web, weekly.mobile, weekly.partner], el);
    } },
];

const dataFor = key => (key === "vegalite" ? long : key === "uplot" ? weekly : wide);
const linesOf = fn => fn.toString().split("\n").length;

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("summary").innerHTML = LIBS.map(l => `<tr><td>${l.name}</td><td>${linesOf(l.draw)}</td><td>${l.license}</td></tr>`).join("");
  for (const lib of LIBS) {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<div class="head"><h2>${lib.name}</h2><span class="lines">${linesOf(lib.draw)} lines</span></div>
      <p class="note">${lib.note}</p><div class="chart" role="img" aria-label="${lib.name}: EMEA revenue by channel"></div>
      <details><summary>Show code</summary><pre></pre></details>`;
    card.querySelector("pre").textContent = lib.draw.toString();
    grid.appendChild(card);
    try { lib.draw(card.querySelector(".chart"), dataFor(lib.key), colors()); }
    catch (err) { card.querySelector(".chart").textContent = `Could not draw: ${err.message}`; }
  }
}

if (!long.length) document.getElementById("grid").textContent = "No data embedded. Run make extract.";
else render();
document.getElementById("theme").addEventListener("click", () => {
  const dark = css("--bg") === "#0e1116";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  render();
});
</script>
</body>
</html>
