# make example marimo: the Lumen Supply dashboard as a marimo notebook.
# http://localhost:3114
services:
  ex-marimo:
    build: .
    image: dashlab-ex-marimo:local
    profiles: ["ex-marimo"]
    environment:
      WAREHOUSE_URL: postgresql://lab_ro:lab_ro@warehouse:5432/lab
    ports:
      - "127.0.0.1:3114:2718"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2718/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
