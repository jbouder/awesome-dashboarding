# make example dash: the Lumen Supply dashboard in Plotly Dash. http://localhost:3112
services:
  ex-dash:
    build: .
    image: dashlab-ex-dash:local
    profiles: ["ex-dash"]
    environment:
      WAREHOUSE_URL: postgresql://lab_ro:lab_ro@warehouse:5432/lab
    ports:
      - "127.0.0.1:3112:8050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/_dash-layout')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
