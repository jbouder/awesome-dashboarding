# Metabase: self-service questions and dashboards.
# http://localhost:3002, admin@dashlab.local / dashlab-admin-1
services:
  metabase:
    image: metabase/metabase:v0.65.6.3
    profiles: ["metabase"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: -Xmx1g
    ports:
      - "127.0.0.1:${METABASE_PORT:-3002}:3000"
    volumes:
      - metabase:/metabase-data
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  metabase-bootstrap:
    image: dashlab-seed:local
    profiles: ["metabase"]
    command: ["python", "/lab/bootstrap.py"]
    environment:
      METABASE_ADMIN_EMAIL: admin@dashlab.local
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-dashlab-admin-1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - ./bootstrap.py:/lab/bootstrap.py:ro
    depends_on:
      metabase:
        condition: service_healthy

volumes:
  metabase:
