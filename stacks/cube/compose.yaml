# Cube: a headless semantic layer. Revenue and the other metrics are defined
# once in model/, and any tool or agent can query them over REST, GraphQL,
# or the Postgres-compatible SQL API.
# Playground: http://localhost:4000. SQL API: localhost:15432 (cube / cube).
services:
  cube:
    image: cubejs/cube:v1.8.31
    profiles: ["cube"]
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: warehouse
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: lab
      CUBEJS_DB_USER: lab_ro
      CUBEJS_DB_PASS: lab_ro
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-dashlab-local-only-cube-secret-0123456789}
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: cube
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:-cube}
      CUBEJS_TELEMETRY: "false"
      CUBEJS_SCHEDULED_REFRESH_DEFAULT: "false"
    ports:
      - "127.0.0.1:${CUBE_PORT:-4000}:4000"
      - "127.0.0.1:${CUBE_SQL_PORT:-15432}:15432"
    volumes:
      - ./model:/cube/conf/model:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
