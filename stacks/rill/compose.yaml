# Rill: fast metrics exploration, with dashboards defined as YAML.
# http://localhost:9009, no sign-in.
services:
  rill:
    build: .
    image: dashlab-rill:local
    profiles: ["rill"]
    ports:
      - "127.0.0.1:${RILL_PORT:-9009}:9009"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9009/v1/ping"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
