# Grafana: operational dashboards and alerting.
# http://localhost:3001, opens as a viewer. Sign in as admin / admin to edit.
services:
  grafana:
    image: grafana/grafana:13.2.6
    profiles: ["grafana"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # For the ClickHouse datasource. Downloaded on first start.
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.23.5
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 40

  # Grafana's MCP server, for agents. http://localhost:5010/mcp
  grafana-mcp:
    image: grafana/mcp-grafana:2.3.0-alpine
    profiles: ["grafana"]
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - localhost:${GRAFANA_MCP_PORT:-5010},127.0.0.1:${GRAFANA_MCP_PORT:-5010},localhost:8000
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${GRAFANA_MCP_PORT:-5010}:8000"
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  grafana:
