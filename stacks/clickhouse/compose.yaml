# ClickHouse: the real-time OLAP engine behind many operational stacks.
# SQL console: http://localhost:8123/play (lab / lab). MCP server for agents:
# http://localhost:5009/mcp. With the grafana stack running, Grafana also
# gets a ClickHouse datasource and dashboard.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.9
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lab}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  clickhouse-mcp:
    build: ./mcp
    image: dashlab-clickhouse-mcp:local
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-lab}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      # Local lab only: no auth, and only the host's loopback may connect.
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"
      CLICKHOUSE_MCP_ALLOWED_HOSTS: 127.0.0.1:${CLICKHOUSE_MCP_PORT:-5009},localhost:${CLICKHOUSE_MCP_PORT:-5009}
    ports:
      - "127.0.0.1:${CLICKHOUSE_MCP_PORT:-5009}:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  clickhouse:
